name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3]
        laravel: ['11.*', '^10.44']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '^10.44'
            testbench: '^8.22'

    name: test PHP${{ matrix.php }} Laravel${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpstan/phpstan:^1.11" "guzzlehttp/guzzle:^7.0" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Static analysis
        run: vendor/bin/phpstan analyse src tests --no-progress --memory-limit=512M

      - name: Execute tests
        run: composer test:ci

  laravel12-probe:
    name: probe PHP8.3 Laravel12 (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Probe install with Laravel 12
        run: |
          composer require "laravel/framework:^12.0" --no-interaction --no-update
          composer require --dev "orchestra/testbench:^10.0" "phpstan/phpstan:^1.11" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: Run tests if install succeeded
        run: composer test:ci
